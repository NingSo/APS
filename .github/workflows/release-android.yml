name: Publish installable Android APK

on:
  push:
    branches: [main]
    paths:
      - '.github/releases/android.json'
      - 'scripts/publish_android.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-android
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check source integrity
        run: python3 scripts/check_source.py
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install APK inspection tools
        run: sdkmanager 'build-tools;36.0.0'
      - name: Verify tested artifact and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/publish_android.py
      - name: Retain release provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-provenance
          path: release-dist/
          if-no-files-found: warn
          retention-days: 14
