name: iOS native build and tests

on:
  push:
    branches: [ios]
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check iOS scope and source
        run: python3 ios/scripts/check_source.py
      - name: Check IPA packaging guards
        run: python3 ios/scripts/test_package_ipa.py
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Prepare native project
        id: prepare
        timeout-minutes: 6
        run: bash ios/scripts/ci.sh prepare
      - name: Compile app and test bundles
        id: build
        timeout-minutes: 12
        run: bash ios/scripts/ci.sh build
      - name: Retain build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aps-ios-build-log
          path: |
            ios/build/build.log
            ios/build/selected-device.json
          if-no-files-found: warn
          retention-days: 14
      - name: Run unit and local proxy integration tests
        id: unit
        timeout-minutes: 10
        run: bash ios/scripts/ci.sh unit
      - name: Retain protocol test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aps-ios-protocol-log
          path: ios/build/unit.log
          if-no-files-found: warn
          retention-days: 14
      - name: Run complete-app UI tests and record motion
        if: always() && steps.build.outcome == 'success' && !cancelled()
        id: ui
        timeout-minutes: 17
        run: bash ios/scripts/ci.sh ui
      - name: Collect native results
        if: always()
        run: bash ios/scripts/ci.sh collect
      - name: Retain native verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aps-ios-verification
          path: |
            ios/build/*.xcresult
            ios/build/screenshots/
            ios/build/*.log
            ios/build/*.json
            ios/build/ui-tests.mov
          if-no-files-found: warn
          retention-days: 14
      - name: Retain simulator app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aps-ios-simulator
          path: ios/build/aps-ios-simulator.zip
          if-no-files-found: error
          retention-days: 14

  publish-device-ipa:
    needs: native
    if: github.ref == 'refs/heads/ios' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release-ios]')))
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Generate native project
        run: bash ios/bootstrap.sh
      - name: Build Release for physical iPhone and iPad
        run: |
          set -o pipefail
          mkdir -p ios/build
          xcodebuild -project ios/APS.xcodeproj -scheme APS -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build/Device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            build 2>&1 | tee ios/build/device-build.log
      - name: Validate device IPA and publish clearly unsigned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 ios/scripts/package_ipa.py
      - name: Retain device build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aps-ios-device-release
          path: |
            ios/build/device-build.log
            ios/build/release/
          if-no-files-found: warn
          retention-days: 14
